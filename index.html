<style>

.box{max-width:520px;margin:auto}
button,input{width:95%;padding:12px;margin:6px;border:none;border-radius:12px;font-size:17px}
button{background:#00bfff;color:#fff;font-weight:bold;cursor:pointer}

button:disabled{opacity:.5;cursor:not-allowed}

<input id="p1" type="text" placeholder="Player IN" autocomplete="off">
<input id="p2" type="text" placeholder="Player OUT" autocomplete="off">
<button id="generateBtn" type="button" disabled>Loading...</button>
<button id="downloadBtn" type="button" disabled>Download</button>
<div id="status">Loading card templates...</div>

</div>

const images={};
const loaded={sub:false,swap:false,emSub:false,emSwap:false};
let mode="sub";

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const p1=document.getElementById("p1");
const p2=document.getElementById("p2");
const generateBtn=document.getElementById("generateBtn");
const downloadBtn=document.getElementById("downloadBtn");
const status=document.getElementById("status");

function setStatus(msg){ status.textContent=msg; }

Object.keys(imageData).forEach(function(key){
  const img=new Image();
  images[key]=img;
  img.onload=function(){
    loaded[key]=true;
    if(Object.values(loaded).every(Boolean)){
      generateBtn.disabled=false;
      generateBtn.textContent="Generate";
      setStatus("Ready ✓");
    }
  };
  img.onerror=function(){
    setStatus("Template loading failed: "+modeNames[key]);
  };
  img.src=imageData[key];
});

function setMode(newMode){
  mode=newMode;
  Object.keys(modeButtons).forEach(function(id){
    document.getElementById(id).classList.toggle("active", modeButtons[id]===mode);
  });
  setStatus(modeNames[mode]+" selected");
}

Object.keys(modeButtons).forEach(function(id){
  document.getElementById(id).addEventListener("click",function(){
    setMode(modeButtons[id]);
  });
});

function fitFont(text, maxWidth, startSize, minSize){
  let size=startSize;
  while(size>minSize){
    ctx.font="bold "+size+"px Arial, sans-serif";
    if(ctx.measureText(text).width <= maxWidth) break;
    size-=2;
  }
  return size;
}

function drawCenteredText(text, box, options){
  if(!text) return;

  const pad=options.pad || 45;
  const maxWidth=box.w-pad*2;
  const size=fitFont(text,maxWidth,options.size||72,options.min||28);

  ctx.save();
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.font="bold "+size+"px Arial, sans-serif";
  ctx.lineJoin="round";
  ctx.lineWidth=options.stroke || Math.max(3, size*0.08);
  ctx.strokeStyle=options.strokeColor || "#000";
  ctx.fillStyle=options.fillColor || "#fff";

  // The text is centered INSIDE the actual colored box.
  ctx.strokeText(text,box.x+box.w/2,box.y+box.h/2);
  ctx.fillText(text,box.x+box.w/2,box.y+box.h/2);
  ctx.restore();
}

function drawCardText(){
  const W=canvas.width, H=canvas.height;
  const tournament=document.getElementById("tournament").value.trim();
  const club=document.getElementById("club").value.trim();
  const a=p1.value.trim();
  const b=p2.value.trim();

  if(W===1080){
    // Normal Substitution / Swap templates.
    if(mode==="sub"){
      drawCenteredText(tournament,{x:30,y:340,w:1020,h:88},{size:42,min:20,fillColor:"#fff",strokeColor:"#000",stroke:5});
      drawCenteredText(club,{x:30,y:495,w:1020,h:88},{size:42,min:20,fillColor:"#fff",strokeColor:"#000",stroke:5});
      drawCenteredText(a,{x:30,y:680,w:1020,h:92},{size:48,min:22,fillColor:"#fff",strokeColor:"#000",stroke:6});
      drawCenteredText(b,{x:30,y:875,w:1020,h:92},{size:48,min:22,fillColor:"#fff",strokeColor:"#000",stroke:6});
    }else{
      drawCenteredText(tournament,{x:30,y:317,w:1020,h:88},{size:42,min:20,fillColor:"#fff",strokeColor:"#000",stroke:5});
      drawCenteredText(club,{x:30,y:466,w:1020,h:88},{size:42,min:20,fillColor:"#fff",strokeColor:"#000",stroke:5});
      drawCenteredText(a,{x:30,y:622,w:1020,h:100},{size:48,min:22,fillColor:"#fff",strokeColor:"#000",stroke:6});
      drawCenteredText(b,{x:30,y:805,w:1020,h:100},{size:48,min:22,fillColor:"#fff",strokeColor:"#000",stroke:6});
    }
  }else{
    // Emergency templates are 2048x2048 and use completely different box positions.
    const pale={fillColor:"#111",strokeColor:"#fff",stroke:7};
    const cyan={fillColor:"#111",strokeColor:"#fff",stroke:7};
    const green={fillColor:"#111",strokeColor:"#fff",stroke:7};

    // Tournament + club are the two blue/purple boxes.
    drawCenteredText(tournament,{x:270,y:305,w:1505,h:108},{size:66,min:28,...pale});
    drawCenteredText(club,{x:270,y:482,w:1505,h:108},{size:66,min:28,...pale});

    if(mode==="emSub"){
      // Yellow Player IN / Player OUT boxes.
      drawCenteredText(a,{x:290,y:700,w:1480,h:165},{size:82,min:32,fillColor:"#111",strokeColor:"#fff",stroke:8});
      drawCenteredText(b,{x:290,y:970,w:1480,h:165},{size:82,min:32,fillColor:"#111",strokeColor:"#fff",stroke:8});
    }else{
      // Green Emergency Swap has the same two large player boxes.
      drawCenteredText(a,{x:290,y:700,w:1480,h:165},{size:82,min:32,fillColor:"#111",strokeColor:"#fff",stroke:8});
      drawCenteredText(b,{x:290,y:970,w:1480,h:165},{size:82,min:32,fillColor:"#111",strokeColor:"#fff",stroke:8});
    }
  }
}

function generate(){
  const a=p1.value.trim();
  const b=p2.value.trim();

  if(!a || !b){
    setStatus("Player IN এবং Player OUT দুটোই দিন.");
    return;
  }

  const bg=images[mode];
  if(!loaded[mode]){
    setStatus("Template এখনও loading...");
    return;
  }

  canvas.width=bg.naturalWidth || bg.width;
  canvas.height=bg.naturalHeight || bg.height;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.drawImage(bg,0,0,canvas.width,canvas.height);

  // No extra "BMG" text is drawn.
  // All user-entered text is centered inside its actual template box.
  drawCardText();

  downloadBtn.disabled=false;
  setStatus("Generated ✓ — সব text box-এর ভিতরে রাখা হয়েছে.");
}

function downloadImg(){
  if(!canvas.width || !canvas.height){
    setStatus("আগে Generate করুন.");
    return;
  }

  // Primary: Blob download.
  canvas.toBlob(function(blob){
    if(!blob){
      fallbackDownload();
      return;
    }
    const url=URL.createObjectURL(blob);
    const link=document.createElement("a");
    link.href=url;
    link.download="BMG-Card.png";
    link.setAttribute("download","BMG-Card.png");
    link.style.display="none";
    document.body.appendChild(link);
    link.click();
    setTimeout(function(){
      link.remove();
      URL.revokeObjectURL(url);
    },1500);
    setStatus("Download started ✓");
  },"image/png");
}

function fallbackDownload(){
  try{
    const url=canvas.toDataURL("image/png",1.0);
    const link=document.createElement("a");
    link.href=url;
    link.download="BMG-Card.png";
    link.setAttribute("download","BMG-Card.png");
    document.body.appendChild(link);
    link.click();
    link.remove();
    setStatus("Download started ✓");
  }catch(e){
    setStatus("Browser download block করেছে. Generated image-এ long-press করে Save করুন.");
  }
}

generateBtn.addEventListener("click",generate);
downloadBtn.addEventListener("click",downloadImg);

})();
