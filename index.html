<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Player Login • LUCC eFootball</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 20%, rgba(94, 50, 180, 0.30), transparent 35%),
        radial-gradient(circle at 90% 20%, rgba(0, 170, 210, 0.22), transparent 35%),
        #050914;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      height: 118px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
      background: rgba(5, 8, 22, 0.95);
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 74px;
      height: 74px;
      border-radius: 20px;
      background: linear-gradient(135deg, #6046ff, #20a9ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 0 8px 25px rgba(70, 80, 255, 0.25);
    }

    .brand-name {
      font-size: 25px;
      font-weight: 800;
    }

    .menu {
      width: 70px;
      height: 70px;
      border-radius: 20px;
      border: 1px solid #263044;
      background: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 6px;
    }

    .menu span {
      width: 27px;
      height: 3px;
      background: #ffffff;
      border-radius: 5px;
    }


    /* =========================
       MAIN
    ========================= */

    .main {
      min-height: calc(100vh - 118px);
      padding: 100px 20px 130px;
      background:
        radial-gradient(circle at 25% 0%, rgba(91, 39, 160, 0.25), transparent 40%),
        radial-gradient(circle at 100% 10%, rgba(0, 174, 220, 0.18), transparent 40%);
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
    }

    .title {
      font-size: 54px;
      line-height: 1.1;
      font-weight: 800;
      margin-bottom: 32px;
    }

    .subtitle {
      color: #9ca7bb;
      font-size: 25px;
      line-height: 1.7;
      margin-bottom: 58px;
    }


    /* =========================
       LOGIN CARD
    ========================= */

    .login-card {
      width: 100%;
      padding: 48px 30px;
      border-radius: 30px;
      background: rgba(16, 23, 37, 0.88);
      border: 1px solid #273348;
      box-shadow: 0 20px 60px rgba(0,0,0,0.28);
    }

    .error-box {
      display: none;
      width: 100%;
      padding: 20px 22px;
      margin-bottom: 25px;
      border-radius: 18px;
      color: #ff9eb0;
      background: rgba(110, 25, 55, 0.15);
      border: 1px solid rgba(255, 75, 125, 0.35);
      font-size: 18px;
      line-height: 1.4;
    }

    .error-box.show {
      display: block;
    }

    .success-box {
      display: none;
      width: 100%;
      padding: 20px 22px;
      margin-bottom: 25px;
      border-radius: 18px;
      color: #8fffc0;
      background: rgba(20, 120, 75, 0.15);
      border: 1px solid rgba(50, 220, 140, 0.35);
      font-size: 18px;
    }

    .success-box.show {
      display: block;
    }

    .label {
      display: block;
      color: #d2d7e2;
      font-size: 20px;
      font-weight: 700;
      margin: 20px 0 12px;
    }

    .input {
      width: 100%;
      height: 74px;
      border-radius: 19px;
      border: 1px solid #29364c;
      background: #080e17;
      color: #ffffff;
      padding: 0 22px;
      font-size: 20px;
      outline: none;
      transition: 0.2s;
    }

    .input:focus {
      border-color: #654cff;
      box-shadow: 0 0 0 3px rgba(101,76,255,0.12);
    }

    .input::placeholder {
      color: #6e7787;
    }

    .login-btn {
      margin-top: 28px;
      height: 68px;
      padding: 0 30px;
      border: 0;
      border-radius: 20px;
      background: linear-gradient(135deg, #704cff, #5332df);
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(92, 59, 245, 0.25);
      transition: 0.2s;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .register-text {
      margin-top: 28px;
      color: #98a2b4;
      font-size: 18px;
    }

    .register-text a {
      color: #a896ff;
      text-decoration: none;
      font-weight: 600;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;
      margin-top: 45px;
      color: #687386;
      font-size: 18px;
    }


    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92px;
      background: rgba(5, 9, 18, 0.98);
      border-top: 1px solid #222b3b;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }

    .nav-item {
      text-align: center;
      color: #818b9e;
      font-size: 14px;
      min-width: 60px;
    }

    .nav-icon {
      display: block;
      font-size: 26px;
      margin-bottom: 5px;
    }

    .nav-item.active {
      color: #ffffff;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .header {
        height: 118px;
        padding: 0 25px;
      }

      .logo {
        width: 74px;
        height: 74px;
      }

      .brand-name {
        font-size: 24px;
      }

      .main {
        padding: 100px 20px 130px;
      }

      .title {
        font-size: 53px;
      }

      .subtitle {
        font-size: 25px;
      }

      .login-card {
        padding: 45px 30px;
      }

      .input {
        height: 74px;
      }
    }
  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================= -->

  <header class="header">

    <div class="brand">

      <div class="logo">
        ⚽
      </div>

      <div class="brand-name">
        LUCC eFootball
      </div>

    </div>


    <div class="menu">
      <span></span>
      <span></span>
      <span></span>
    </div>

  </header>



  <!-- =========================
       MAIN
  ========================= -->

  <main class="main">

    <div class="container">

      <h1 class="title">
        Player Login
      </h1>

      <p class="subtitle">
        Login to access your profile and tournament dashboard.
      </p>


      <!-- LOGIN CARD -->

      <div class="login-card">

        <div id="errorBox" class="error-box"></div>

        <div id="successBox" class="success-box"></div>


        <form id="loginForm">

          <label class="label" for="email">
            Email
          </label>

          <input
            class="input"
            id="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >


          <label class="label" for="password">
            Password
          </label>

          <input
            class="input"
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >


          <button
            id="loginButton"
            class="login-btn"
            type="submit"
          >
            Login
          </button>

        </form>


        <div class="register-text">

          Don't have an account?

          <a href="register.html">
            Register
          </a>

        </div>

      </div>


      <div class="footer">
        LUCC eFootball • Competitive Gaming Platform
      </div>

    </div>

  </main>



  <!-- =========================
       BOTTOM NAV
  ========================= -->

  <nav class="bottom-nav">

    <div class="nav-item">
      <span class="nav-icon">⌂</span>
      Home
    </div>

    <div class="nav-item">
      <span class="nav-icon">🏆</span>
      Tournament
    </div>

    <div class="nav-item">
      <span class="nav-icon">👥</span>
      Players
    </div>

    <div class="nav-item">
      <span class="nav-icon">📊</span>
      Results
    </div>

    <div class="nav-item active">
      <span class="nav-icon">👤</span>
      Profile
    </div>

  </nav>



  <!-- =========================
       FIREBASE LOGIN
  ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.17.0/firebase-auth.js";


    /* =========================
       YOUR FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey: "AIzaSyDKU2meBGjkJ9AixVaLGEPCVT1wqo5vMik",

      authDomain:
        "lucc-efootball-tournamen-a2eef.firebaseapp.com",

      projectId:
        "lucc-efootball-tournamen-a2eef",

      storageBucket:
        "lucc-efootball-tournamen-a2eef.firebasestorage.app",

      messagingSenderId:
        "562916468135",

      appId:
        "1:562916468135:web:8e8b72af92757f407dc282",

      measurementId:
        "G-HRMKH8HFQZ"

    };


    /* =========================
       INITIALIZE FIREBASE
    ========================= */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* =========================
       ELEMENTS
    ========================= */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const errorBox =
      document.getElementById("errorBox");

    const successBox =
      document.getElementById("successBox");


    /* =========================
       SHOW ERROR
    ========================= */

    function showError(message) {

      errorBox.textContent = message;

      errorBox.classList.add("show");

      successBox.classList.remove("show");

    }


    /* =========================
       SHOW SUCCESS
    ========================= */

    function showSuccess(message) {

      successBox.textContent = message;

      successBox.classList.add("show");

      errorBox.classList.remove("show");

    }


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        errorBox.classList.remove("show");

        successBox.classList.remove("show");


        if (!email || !password) {

          showError(
            "Please enter your email and password."
          );

          return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";


        try {

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          console.log(
            "Login successful:",
            userCredential.user
          );


          showSuccess(
            "Login successful! Redirecting..."
          );


          /*
             IMPORTANT:
             Login success হলে এখানে
             তোমার profile/dashboard page-এ যাবে।
          */

          setTimeout(function() {

            window.location.href =
              "profile.html";

          }, 800);


        }

        catch (error) {

          console.error(
            "Firebase Login Error:",
            error
          );


          if (
            error.code ===
            "auth/api-key-not-valid"
          ) {

            showError(
              "Firebase API key is invalid. Please check your Firebase project configuration."
            );

          }

          else if (
            error.code ===
            "auth/invalid-credential"
          ) {

            showError(
              "Wrong email or password."
            );

          }

          else if (
            error.code ===
            "auth/user-not-found"
          ) {

            showError(
              "No account found with this email."
            );

          }

          else if (
            error.code ===
            "auth/wrong-password"
          ) {

            showError(
              "Wrong password."
            );

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            showError(
              "Please enter a valid email address."
            );

          }

          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            showError(
              "Too many login attempts. Please try again later."
            );

          }

          else {

            showError(
              error.message ||
              "Login failed. Please try again."
            );

          }

        }


        finally {

          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

        }

      }
    );

  </script>

</body>
</html>
